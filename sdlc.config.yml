SDLC_BASE_BRANCH: main

SDLC_ARTIFACT_HYGIENE_PATTERNS: |
  ^dist/
  ^build/

# Arena is reserved for high-risk changes in this repo: anything that
# touches the sanitizer (lib-sanitize.sh), the wrappers (adversary-
# review / security-review), the bash guard hook, or the agent role
# prompts themselves (.claude/agents/) is high-risk — touching an agent
# changes how downstream subagents read the world.
SDLC_ARENA_ELIGIBILITY_REGEX: "(scripts/lib-sanitize\\.sh|scripts/review-attempt|scripts/adversary-review|scripts/claude-adversary-review|scripts/security-review|scripts/agent-capsule-|scripts/(codex|claude)-capsule-run|scripts/worktree-add-external|scripts/test-(agent-capsule|codex-capsule|claude-capsule|adversary-review|security-review)|scripts/backlog-index|\\.claude/hooks/guard-bash\\.sh|\\.claude/settings\\.example\\.json|\\.claude/agents/|feature-arena)"

SDLC_PROTECTED_PATHS: |
  scripts/lib-sanitize.sh
  scripts/review-attempt
  scripts/adversary-review
  scripts/claude-adversary-review
  scripts/security-review
  scripts/agent-capsule-
  scripts/agent-capsule-lib
  scripts/codex-capsule-run
  scripts/claude-capsule-run
  scripts/worktree-add-external
  scripts/test-agent-capsule-
  scripts/test-codex-capsule-run
  scripts/test-claude-capsule-run
  scripts/test-adversary-review
  scripts/test-security-review
  scripts/backlog-index
  .claude/hooks/guard-bash.sh
  .claude/settings.example.json

SDLC_CLAUDE_ADVERSARY_REQUIRED_MODEL: claude-opus-4-8
SDLC_REVIEW_STAGE_CROSS_MODEL_ADVERSARIAL_REQUIRED: true
SDLC_QA_COVERAGE_LEDGER_REQUIRED: true
# Immutable boundary for the all-tier receipt/evidence contract. Tasks that
# were already Done at this commit remain legacy; current and future
# code-bearing Review/Done tasks must satisfy the tracked receipt gates.
SDLC_REVIEW_RECEIPT_ADOPTION_COMMIT: 2e973b68a8b04dff982a21ed262a709764f977d3
SDLC_BACKLOG_AREAS_RE: "^(product|platform|sdlc-harness|security|quality|docs|ops|other)$"
