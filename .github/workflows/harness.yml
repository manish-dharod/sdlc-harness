name: Harness self-test

on:
  pull_request:
    paths:
      - '.claude/**'
      - '.github/workflows/harness.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'sdlc.config.yml*'
  push:
    branches:
      - main
    paths:
      - '.claude/**'
      - '.github/workflows/harness.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'sdlc.config.yml*'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run harness self-test
        run: scripts/test-framework-v3
