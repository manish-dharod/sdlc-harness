name: Harness self-test

on:
  pull_request:
    paths:
      - '.claude/**'
      - '.github/workflows/harness.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'sdlc.config.yml*'
  push:
    branches:
      - main
    paths:
      - '.claude/**'
      - '.github/workflows/harness.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'sdlc.config.yml*'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cross-model receipt tests bind a committed candidate to an ancestor
          # and verify remote-first merge-base selection.
          fetch-depth: 0
      - name: Run harness self-test
        run: scripts/test-framework-v3
      - name: Run all-tier readiness contract tests
        run: scripts/test-feature-readiness
      - name: Run linked-worktree verification lock tests
        run: scripts/test-feature-verify-locking
      - name: Run shippable increment validator tests
        run: scripts/test-feature-increment
      - name: Run approval queue tests
        run: scripts/test-approvals-pending
      - name: Run local memory tests
        run: scripts/test-sdlc-memory
      - name: Run maintenance report tests
        run: scripts/test-sdlc-maintain full
      - name: Run portable CSI behavioral tests
        run: scripts/test-portable-csi full
